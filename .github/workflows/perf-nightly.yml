name: Nightly performance
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      reset-baseline:
        description: Replace the stored performance baseline
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: perf-nightly
  cancel-in-progress: false
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESET_BASELINE: ${{ inputs.reset-baseline || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Measure full server workloads
        run: bun run perf:server --output=.performance/candidate.json
      - name: Download latest retained main baseline
        if: env.RESET_BASELINE != 'true'
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/$GH_REPO/actions/artifacts?name=perf-baseline&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .id // empty')"
          if [[ -n "$artifact_id" ]]; then
            gh api "repos/$GH_REPO/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/perf-baseline.zip"
            mkdir -p .performance/baseline
            unzip -q "$RUNNER_TEMP/perf-baseline.zip" -d .performance/baseline
          fi
      - name: Compare or establish baseline
        id: compare
        run: bun scripts/performance-nightly.ts .performance/candidate.json .performance/baseline/candidate.json
      - name: Retain baseline
        if: steps.compare.outputs.replace-baseline == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-baseline
          path: .performance/candidate.json
          retention-days: 90
      - name: Retain candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .performance/
          retention-days: 30
          if-no-files-found: ignore
